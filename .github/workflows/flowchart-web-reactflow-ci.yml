name: flowchart-web-reactflow CI

on:
  push:
    paths:
      - "flowchart-web-reactflow/**"
      - ".github/workflows/flowchart-web-reactflow-ci.yml"
  pull_request:
    paths:
      - "flowchart-web-reactflow/**"
      - ".github/workflows/flowchart-web-reactflow-ci.yml"

defaults:
  run:
    working-directory: flowchart-web-reactflow

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flowchart-web-reactflow/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dev tools
        run: pip install ruff pre-commit pytest openpyxl mypy

      - name: Ruff (excel_normalize)
        run: npm run excel:lint

      - name: mypy (excel_normalize)
        run: npm run excel:mypy

      - name: pre-commit (security + Python hooks)
        working-directory: .
        run: pre-commit run --all-files --hook-stage pre-commit --config flowchart-web-reactflow/.pre-commit-config.yaml

      - name: pytest (excel_normalize)
        run: npm run excel:test

      - name: Next.js build
        run: npm run build
        env:
          AUTH_DISABLED: "1"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      AUTH_DISABLED: "1"
      IMPORT_E2E_STUB: "1"
      RESET_FLOW_E2E_STUB: "1"
      PLAYWRIGHT_E2E: "1"
      PLAYWRIGHT_FORCE_WEBSERVER: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flowchart-web-reactflow/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Next.js build (E2E)
        run: npm run build

      - name: Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            flowchart-web-reactflow/test-results/
            flowchart-web-reactflow/playwright-report/
          if-no-files-found: ignore
